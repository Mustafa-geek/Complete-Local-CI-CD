name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  quality:

    name: Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml


      - name: Run unit tests
        working-directory: backend
        run: ./mvnw --batch-mode clean verify


      - name: Start SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288

          docker run -d \
            --name sonarqube \
            -p 9000:9000 \
            sonarqube:community

          echo "Waiting for SonarQube..."

          for i in {1..60}; do

            STATUS=$(curl -s \
              http://localhost:9000/api/system/status \
              | jq -r '.status' 2>/dev/null || true)

            echo "SonarQube status: $STATUS"

            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready"
              break
            fi

            sleep 5

          done


      - name: Generate SonarQube token
        id: sonar-token
        run: |
          RESPONSE=$(curl -sS \
            -u admin:admin \
            -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            --data-urlencode "name=github-${GITHUB_RUN_ID}")

          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Unable to generate SonarQube token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"


      - name: Run SonarQube analysis
        working-directory: backend
        run: |
          ./mvnw --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=three-tier-project \
            -Dsonar.projectName=Three-Tier-Project \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${{ steps.sonar-token.outputs.token }} \
            -Dsonar.qualitygate.wait=true


      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7


      - name: Stop SonarQube
        if: always()
        run: docker rm -f sonarqube || true


  docker-build:

    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build backend image
        run: |
          docker build \
            -t three-tier-backend:${{ github.sha }} \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            -t three-tier-frontend:${{ github.sha }} \
            ./frontend
