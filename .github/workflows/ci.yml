name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      # Prevent loop: ignore commits made by the CI itself to update image tags
      - 'helm/three-tier/values.yaml'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write   # needed to commit image tag back to repo

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Unit Tests + SonarQube
  # ─────────────────────────────────────────────────────────────────
  quality:

    name: Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        working-directory: backend
        run: ./mvnw --batch-mode clean verify

      - name: Start SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288

          docker run -d \
            --name sonarqube \
            -p 9000:9000 \
            sonarqube:community

          echo "Waiting for SonarQube to become ready..."

          for i in {1..60}; do
            STATUS=$(curl -s \
              http://localhost:9000/api/system/status \
              | jq -r '.status' 2>/dev/null || true)

            echo "SonarQube status: $STATUS"

            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready"
              break
            fi

            sleep 5
          done

      - name: Generate SonarQube token
        id: sonar-token
        run: |
          RESPONSE=$(curl -sS \
            -u admin:admin \
            -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            --data-urlencode "name=github-${GITHUB_RUN_ID}")

          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Unable to generate SonarQube token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube analysis
        working-directory: backend
        run: |
          ./mvnw --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=three-tier-project \
            -Dsonar.projectName=Three-Tier-Project \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${{ steps.sonar-token.outputs.token }} \
            -Dsonar.qualitygate.wait=true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop SonarQube
        if: always()
        run: docker rm -f sonarqube || true


  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build + Push to Docker Hub + Update Helm values
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────────────
  docker-push:

    name: Build, Push & Update Helm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - quality

    # Only push images on real commits to main, not on PRs
    if: github.event_name != 'pull_request'

    env:
      DOCKERHUB_USERNAME: khazimustafa
      FRONTEND_REPO: khazimustafa/three-tier-frontend
      BACKEND_REPO:  khazimustafa/three-tier-backend
      IMAGE_TAG:     ${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT so the commit-back triggers ArgoCD (GITHUB_TOKEN commits don't re-trigger push events)
          token: ${{ secrets.GH_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Keep only the 3 most recent tags on Docker Hub ─────────────
      - name: Prune Docker Hub tags (keep latest 3)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          prune_tags() {
            local REPO="$1"
            local KEEP=3

            echo "==> Pruning tags for ${REPO}, keeping ${KEEP} most recent..."

            # Get a JWT token for the Docker Hub v2 API
            JWT=$(curl -s \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              "https://hub.docker.com/v2/users/login/" \
              | jq -r '.token')

            # Fetch all tags sorted by last_updated (newest first)
            TAGS=$(curl -s \
              -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/?page_size=100&ordering=-last_updated" \
              | jq -r '.results[].name')

            COUNT=0
            for TAG in $TAGS; do
              COUNT=$((COUNT + 1))
              if [ "$COUNT" -gt "$KEEP" ]; then
                echo "  Deleting old tag: ${TAG}"
                curl -s -X DELETE \
                  -H "Authorization: JWT ${JWT}" \
                  "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" \
                  && echo "  Deleted: ${TAG}" \
                  || echo "  Warning: could not delete ${TAG}"
              else
                echo "  Keeping tag: ${TAG}"
              fi
            done
          }

          prune_tags "$FRONTEND_REPO"
          prune_tags "$BACKEND_REPO"

      # ── Update Helm values.yaml with new image tags ─────────────────
      - name: Update Helm values.yaml with new image tags
        run: |
          # Use yq to update the image tags in values.yaml
          # Install yq if not present
          if ! command -v yq &>/dev/null; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          yq e -i ".frontend.image.tag = \"${IMAGE_TAG}\"" helm/three-tier/values.yaml
          yq e -i ".backend.image.tag  = \"${IMAGE_TAG}\"" helm/three-tier/values.yaml

          echo "Updated helm/three-tier/values.yaml:"
          cat helm/three-tier/values.yaml

      - name: Commit and push updated Helm values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm/three-tier/values.yaml

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit (same SHA already in values.yaml)"
          else
            git commit -m "ci: update image tags to ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi

      # ── Summary ─────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "### 🐳 Docker Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${FRONTEND_REPO}\` | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${BACKEND_REPO}\`  | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔁 ArgoCD will auto-sync the new image tags to the Kind cluster." >> "$GITHUB_STEP_SUMMARY"
