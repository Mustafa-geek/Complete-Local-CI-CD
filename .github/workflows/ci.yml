name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and SonarQube Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests and generate JaCoCo report
        working-directory: backend
        run: ./mvnw --batch-mode clean verify

      - name: Start ephemeral SonarQube
        id: sonarqube
        env:
          SONAR_IMAGE: sonarqube:community
        run: bash .github/scripts/start-sonarqube.sh

      - name: Run SonarQube analysis and enforce quality gate
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ steps.sonarqube.outputs.token }}
          SONAR_HOST_URL: ${{ steps.sonarqube.outputs.host_url }}

      - name: Upload unit-test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop ephemeral SonarQube
        if: always()
        run: docker rm -f sonarqube-ci || true

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --tag three-tier-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build --tag three-tier-frontend:${{ github.sha }} ./frontend
