apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: three-tier
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mysql.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.mysql.storage.size }}
