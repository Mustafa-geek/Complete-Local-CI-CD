apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: three-tier
spec:
  selector:
    app: backend
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
